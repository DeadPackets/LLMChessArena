services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - chess-data:/app/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - STOCKFISH_PATH=/usr/games/stockfish
      - GAMES_PER_DAY=${GAMES_PER_DAY:-1}
      - MIN_KEY_BALANCE_USD=${MIN_KEY_BALANCE_USD:-2}
      - DAILY_BUDGET_USD=${DAILY_BUDGET_USD:-0}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-llmchess.deadpackets.pw}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  chess-data:
